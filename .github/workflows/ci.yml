name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: node node_modules/playwright/cli.js install --with-deps --no-shell chromium
      - if: runner.os == 'Windows'
        run: npm run setup
      - run: npm run check
      - run: npm run test:package
        env:
          ACCESSRECHECK_TEST_FIRST_INSTALL: ${{ runner.os == 'Linux' && matrix.node == 22 && '1' || '0' }}
